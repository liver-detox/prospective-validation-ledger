name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: prospective-ledger verify examples/SYNTHETIC_eligible --out "$RUNNER_TEMP/receipt.json"
      - run: cmp examples/SYNTHETIC_expected_receipt.json "$RUNNER_TEMP/receipt.json"
      - run: |
          if prospective-ledger verify examples/SYNTHETIC_late_arrival --out "$RUNNER_TEMP/late-receipt.json"; then
            echo "late-arrival fixture unexpectedly passed" >&2
            exit 1
          fi
          cmp examples/SYNTHETIC_late_arrival_expected_receipt.json "$RUNNER_TEMP/late-receipt.json"
      - run: |
          package_source="$RUNNER_TEMP/package-source"
          mkdir "$package_source"
          cp -R README.md DATA_POLICY.md LICENSE MANIFEST.in pyproject.toml src examples "$package_source"
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/dist" "$package_source"
          python - "$RUNNER_TEMP/dist" <<'PY'
          from pathlib import Path
          import sys
          from zipfile import ZipFile

          wheel = next(Path(sys.argv[1]).glob("prospective_validation_ledger-*.whl"))
          expected = {
              "examples/SYNTHETIC_draft/plan.json",
              "examples/SYNTHETIC_eligible/ledger.jsonl",
              "examples/SYNTHETIC_expected_receipt.json",
              "examples/SYNTHETIC_late_arrival_draft/ledger.jsonl",
              "examples/SYNTHETIC_late_arrival/ledger.jsonl",
              "examples/SYNTHETIC_late_arrival_expected_receipt.json",
          }
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          missing = [
              item for item in expected if not any(name.endswith(item) for name in names)
          ]
          if missing:
              raise SystemExit(f"wheel is missing public examples: {missing}")
          PY
