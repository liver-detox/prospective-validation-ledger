[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prospective-validation-ledger"
version = "0.2.0"
description = "Verify declared point-in-time sample eligibility and late-arrival evidence."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
authors = [{name = "liver-detox"}]
dependencies = []

[project.scripts]
prospective-ledger = "prospective_validation_ledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/prospective-validation-ledger/examples/SYNTHETIC_draft" = [
  "examples/SYNTHETIC_draft/plan.json",
  "examples/SYNTHETIC_draft/snapshot.json",
  "examples/SYNTHETIC_draft/ledger.jsonl",
]
"share/prospective-validation-ledger/examples/SYNTHETIC_eligible" = [
  "examples/SYNTHETIC_eligible/plan.json",
  "examples/SYNTHETIC_eligible/snapshot.json",
  "examples/SYNTHETIC_eligible/ledger.jsonl",
]
"share/prospective-validation-ledger/examples/SYNTHETIC_late_arrival_draft" = [
  "examples/SYNTHETIC_late_arrival_draft/plan.json",
  "examples/SYNTHETIC_late_arrival_draft/snapshot.json",
  "examples/SYNTHETIC_late_arrival_draft/ledger.jsonl",
]
"share/prospective-validation-ledger/examples/SYNTHETIC_late_arrival" = [
  "examples/SYNTHETIC_late_arrival/plan.json",
  "examples/SYNTHETIC_late_arrival/snapshot.json",
  "examples/SYNTHETIC_late_arrival/ledger.jsonl",
]
"share/prospective-validation-ledger/examples" = [
  "examples/SYNTHETIC_expected_receipt.json",
  "examples/SYNTHETIC_late_arrival_expected_receipt.json",
]
